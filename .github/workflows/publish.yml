name: Build and publish rule-set

on:
  schedule:
    # 每天 UTC 23:00 = 北京时间 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "filters.json"
      - "overlays/**"
      - "seeds/**"
      - "blacklist.json"
      - "supplement_allow.json"
      - "build.py"
      - "discover.py"
      - "verify_dns.py"
      - "coverage.py"
      - "publish_layout.py"
      - "check_samples.py"
      - "samples.json"
      - "verify.py"
      - "official_lists.py"
      - "verify.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

# 同一时间只允许跑一个构建：避免定时构建和手动/推送触发的构建同时往 rule-set 分支推送
concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    # 超时即失败且不发布（客户端继续用上一次的规则集）；正常构建只需十几分钟
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        env:
          SING_BOX_VERSION: "1.14.2"
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          mv "/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" tools/sing-box
          chmod +x tools/sing-box
          ./tools/sing-box version

      - name: Build rulesets
        run: python3 -u build.py --refresh

      - name: Check samples (stop publishing if routing samples fail)
        run: python3 check_samples.py

      - name: Prepare publish tree
        run: |
          set -euo pipefail
          python3 publish_layout.py
          find publish-out -type f | sort

      - name: Push rule-set branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-out
          publish_branch: rule-set
          # 不再 force_orphan：保留历史，回滚时直接 reset 到上一个提交（见 rollback.yml）
          enable_jekyll: true
          commit_message: "chore: update rule-set"

      - name: Commit auto-blacklist back to main
        run: |
          set -euo pipefail
          if git diff --quiet -- blacklist.json; then
            echo "blacklist.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blacklist.json
          git commit -m "chore: 更新自动黑名单"
          # GITHUB_TOKEN 推送不会触发新的 workflow run，避免死循环
          git push origin HEAD:main
