name: Build and publish rule-set

on:
  schedule:
    # 每天 UTC 02:00 ≈ 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "filters.json"
      - "overlays/**"
      - "seeds/**"
      - "build.py"
      - "discover.py"
      - "verify_dns.py"
      - "publish_layout.py"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        env:
          SING_BOX_VERSION: "1.14.2"
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          mv "/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" tools/sing-box
          chmod +x tools/sing-box
          ./tools/sing-box version

      - name: Build rulesets
        run: python3 -u build.py --refresh

      - name: Prepare publish tree
        run: |
          set -euo pipefail
          python3 publish_layout.py
          find publish-out -type f | sort

      - name: Push rule-set branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-out
          publish_branch: rule-set
          force_orphan: true
          enable_jekyll: true
          commit_message: "chore: update rule-set"
